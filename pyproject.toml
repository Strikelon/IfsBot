[project]
name = "ifs-bot"
version = "0.1.0"
description = "Telegram-бот для разбора снов, ситуаций и внутренних конфликтов по IFS"
requires-python = "==3.12.*"
dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "aiosqlite>=0.20,<0.21",
    "alembic>=1.13,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "structlog>=24.4,<25",
    "openai>=1.50,<2",
    "httpx>=0.27,<0.28",
    "asyncpg>=0.31.0",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.12,<0.1",
    "bcrypt>=4.2,<5",
    "itsdangerous>=2.2,<3",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
    "aiohttp-socks>=0.11.0",
    "sentry-sdk>=2.0,<3",
]

[dependency-groups]
dev = [
    "paramiko>=5.0.0",
    "matplotlib>=3.8,<4",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "python-dotenv>=1.2.2",
    "ruff>=0.7,<0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/adapters", "src/data", "src/domain", "src/llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.File"]

[tool.ruff.format]
quote-style = "double"
